<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 视频生成 - H5</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      min-height: 100vh;
    }
    .container { max-width: 680px; margin: 0 auto; padding: 20px; }

    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { font-size: 26px; margin-bottom: 6px; }
    .header p { color: #8892b0; font-size: 13px; }

    /* 图片上传区 */
    .upload-section {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      border: 2px dashed rgba(255,255,255,0.1);
      text-align: center;
    }
    .upload-section.dragover {
      border-color: rgba(102, 187, 106, 0.5);
      background: rgba(102, 187, 106, 0.05);
    }

    /* 缩略图网格 */
    .thumbnail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 12px;
      margin: 16px 0;
    }
    .thumbnail {
      position: relative;
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      background: rgba(0,0,0,0.3);
    }
    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .thumbnail .remove-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(239, 83, 80, 0.9);
      color: #fff;
      border: none;
      font-size: 14px;
      line-height: 22px;
      text-align: center;
      cursor: pointer;
    }

    /* 上传提示 */
    .upload-hint {
      color: #8892b0;
      font-size: 14px;
      margin-top: 12px;
    }
    .upload-hint input[type="file"] {
      display: none;
    }

    /* 操作按钮 */
    .btn-row {
      text-align: center;
      margin: 16px 0;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin: 4px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #66bb6a 0%, #43a047 100%);
      color: #fff;
    }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }
    .btn-clear {
      background: rgba(239, 83, 80, 0.15);
      color: #ef8350;
      padding: 8px 16px;
      font-size: 13px;
    }

    /* 状态区 */
    .status-area {
      text-align: center;
      padding: 24px 20px;
      display: none;
    }
    .status-area.show { display: block; }
    .status-area .spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: #66bb6a;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .progress-bar {
      width: 200px; height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      margin: 12px auto;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #66bb6a, #43a047);
      border-radius: 3px;
      transition: width 0.3s;
    }
    .status-text { color: #8892b0; font-size: 13px; margin-top: 8px; }

    /* 结果区 */
    .result-area {
      display: none;
      text-align: center;
      margin-top: 20px;
    }
    .result-area.show { display: block; }
    .result-video {
      max-width: 100%;
      border-radius: 12px;
      margin: 12px 0;
      background: rgba(0,0,0,0.3);
    }
    .result-info {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 16px;
      margin: 12px 0;
      text-align: left;
      font-size: 13px;
      color: #ccc;
    }
    .result-info pre {
      white-space: pre-wrap;
      word-break: break-all;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: #8892b0;
      margin: 8px 0;
    }

    /* 错误面板 */
    .error-panel {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .error-panel.show { display: flex; }
    .error-content {
      background: #1e1e1e;
      border-radius: 16px;
      padding: 24px;
      max-width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      width: 520px;
    }
    .error-content h3 {
      color: #ef5350;
      margin-bottom: 16px;
      font-size: 18px;
    }
    .error-content pre {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: #ff8a80;
      white-space: pre-wrap;
      word-break: break-all;
      background: rgba(239, 83, 80, 0.08);
      padding: 12px;
      border-radius: 8px;
      margin: 12px 0;
      max-height: 400px;
      overflow-y: auto;
    }
    .error-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      justify-content: flex-end;
    }
    .error-actions .btn {
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎬 AI 视频生成</h1>
      <p>上传图片 → AI 分析场景 → FFmpeg 生成视频</p>
    </div>

    <!-- 图片上传区 -->
    <div class="upload-section" id="uploadSection">
      <div class="thumbnail-grid" id="thumbnailGrid"></div>
      <div class="upload-hint" id="uploadHint">
        <label class="btn btn-secondary" for="fileInput">📷 选择图片</label>
        <input type="file" id="fileInput" accept="image/*" multiple>
        <p style="margin-top: 8px; font-size: 12px; color: #666;">支持 JPG/PNG，多张可批量上传</p>
      </div>
      <div id="uploadActions" style="display: none;">
        <button class="btn btn-secondary btn-clear" id="clearAllBtn">🗑️ 清空全部</button>
      </div>
    </div>

    <!-- 生成按钮 -->
    <div class="btn-row">
      <button class="btn btn-primary" id="generateBtn" disabled>✨ 开始生成</button>
    </div>

    <!-- 状态区 -->
    <div class="status-area" id="statusArea">
      <div class="spinner"></div>
      <p id="statusText">正在处理...</p>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 0%"></div></div>
      <p class="status-text" id="statusTextDetail"></p>
    </div>

    <!-- 结果区 -->
    <div class="result-area" id="resultArea">
      <h2 style="margin-bottom: 12px; color: #66bb6a;">✅ 生成成功</h2>
      <video class="result-video" id="resultVideo" controls></video>
      <div class="result-info" id="resultInfo"></div>
      <div class="btn-row">
        <button class="btn btn-secondary" id="reGenerateBtn">🔄 重新生成</button>
      </div>
    </div>
  </div>

  <!-- 错误面板 -->
  <div class="error-panel" id="errorPanel">
    <div class="error-content">
      <h3>❌ 处理失败</h3>
      <pre id="errorContent"></pre>
      <div class="error-actions">
        <button class="btn btn-secondary" id="copyErrorBtn">📋 复制错误</button>
        <button class="btn btn-secondary" id="closeErrorBtn">关闭</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;

    // ============ 状态 ============
    let uploadedImages = []; // { name, file, base64, id }

    // ============ DOM ============
    const fileInput = document.getElementById('fileInput');
    const thumbnailGrid = document.getElementById('thumbnailGrid');
    const uploadHint = document.getElementById('uploadHint');
    const uploadActions = document.getElementById('uploadActions');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const generateBtn = document.getElementById('generateBtn');
    const statusArea = document.getElementById('statusArea');
    const progressFill = document.getElementById('progressFill');
    const resultArea = document.getElementById('resultArea');
    const resultVideo = document.getElementById('resultVideo');
    const resultInfo = document.getElementById('resultInfo');
    const errorPanel = document.getElementById('errorPanel');

    // ============ 多图片上传 ============
    fileInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      for (const file of files) {
        if (file.size > 10 * 1024 * 1024) {
          console.warn(`[upload] 跳过过大文件: ${file.name} (${(file.size/1024/1024).toFixed(1)}MB)`);
          continue;
        }
        if (!file.type.startsWith('image/')) continue;

        const base64 = await fileToBase64(file);
        const imgObj = {
          name: file.name,
          file: file,
          base64: base64,
          id: 'img_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6)
        };
        uploadedImages.push(imgObj);
        renderThumbnail(imgObj);
        console.log(`[upload] 添加: ${file.name}, ${imgObj.id}`);
      }

      fileInput.value = '';
      updateUploadState();
    });

    function renderThumbnail(imgObj) {
      const div = document.createElement('div');
      div.className = 'thumbnail';
      div.id = 'thumb_' + imgObj.id;
      div.innerHTML = `
        <img src="${imgObj.base64}" alt="${imgObj.name}">
        <button class="remove-btn" onclick="removeThumbnail('${imgObj.id}')">×</button>
      `;
      thumbnailGrid.appendChild(div);
    }

    function removeThumbnail(id) {
      uploadedImages = uploadedImages.filter(img => img.id !== id);
      const el = document.getElementById('thumb_' + id);
      if (el) el.remove();
      updateUploadState();
    }

    function updateUploadState() {
      if (uploadedImages.length === 0) {
        uploadHint.style.display = 'block';
        uploadActions.style.display = 'none';
        generateBtn.disabled = true;
        thumbnailGrid.innerHTML = '';
      } else {
        uploadHint.style.display = 'none';
        uploadActions.style.display = 'block';
        generateBtn.disabled = false;
      }
    }

    clearAllBtn.addEventListener('click', () => {
      uploadedImages = [];
      thumbnailGrid.innerHTML = '';
      updateUploadState();
    });

    // ============ 生成视频 ============
    generateBtn.addEventListener('click', onGenerate);
    document.getElementById('reGenerateBtn').addEventListener('click', () => {
      resultArea.classList.remove('show');
      errorPanel.classList.remove('show');
      statusArea.classList.add('show');
      generateBtn.disabled = false;
    });

    async function onGenerate() {
      if (uploadedImages.length === 0) return;

      generateBtn.disabled = true;
      resultArea.classList.remove('show');
      errorPanel.classList.remove('show');

      // Step 1: 上传所有图片
      setStatus('正在上传图片...', 10);
      const uploadResult = await uploadImages();
      const imageIds = uploadResult.images.map(img => img.id);

      // Step 2: 分析场景
      setStatus('AI 正在分析图片场景...', 30);
      const analysisResult = await analyzeScenes(imageIds);

      // Step 3: 生成视频
      setStatus('FFmpeg 正在生成视频...', 60);
      const videoResult = await generateVideo(imageIds, analysisResult);

      // Step 4: 显示结果
      setStatus('完成！', 100);
      showResult(videoResult);
    }

    function setStatus(text, progress) {
      statusArea.classList.add('show');
      document.getElementById('statusText').textContent = text;
      progressFill.style.width = progress + '%';
    }

    async function uploadImages() {
      const formData = new FormData();
      uploadedImages.forEach((img, i) => {
        formData.append('images', img.file);
        console.log(`[upload] 图片${i+1}: ${img.name}, size=${img.file.size}B, id=${img.id}`);
      });
      console.log(`[upload] 共 ${uploadedImages.length} 张图片，API=${API_BASE}/api/upload`);

      const resp = await fetch(`${API_BASE}/api/upload`, {
        method: 'POST',
        body: formData,
      });
      if (!resp.ok) {
        throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
      }
      const data = await resp.json();
      console.log(`[upload] 成功: ${JSON.stringify(data)}`);
      return data;
    }

    async function analyzeScenes(imageIds) {
      console.log(`[analyze] 发送分析请求，图片IDs: ${JSON.stringify(imageIds)}`);
      const resp = await fetch(`${API_BASE}/api/analyze`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image_ids: imageIds }),
      });
      if (!resp.ok) {
        const errText = await resp.text();
        throw new Error(`分析失败 ${resp.status}: ${errText}`);
      }
      const data = await resp.json();
      console.log(`[analyze] 成功: ${JSON.stringify(data)}`);
      return data;
    }

    async function generateVideo(imageIds, analysis) {
      console.log(`[generate] 发送生成请求`);
      const resp = await fetch(`${API_BASE}/api/generate-video`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image_ids: imageIds, analysis: analysis }),
      });
      if (!resp.ok) {
        const errText = await resp.text();
        throw new Error(`生成失败 ${resp.status}: ${errText}`);
      }
      const data = await resp.json();
      console.log(`[generate] 成功: ${JSON.stringify(data)}`);
      return data;
    }

    function showResult(videoResult) {
      statusArea.classList.remove('show');
      resultArea.classList.add('show');

      const videoUrl = API_BASE + '/output/' + videoResult.output_file;
      resultVideo.src = videoUrl;
      resultInfo.innerHTML = `
        <p><strong>场景类型：</strong>${videoResult.scene_type || '未知'}</p>
        <p><strong>应用滤镜：</strong>${videoResult.filter || '无'}</p>
        <p><strong>输出文件：</strong>${videoResult.output_file}</p>
        <p><strong>文件路径：</strong>${videoResult.output_path || videoUrl}</p>
        <pre>${JSON.stringify(videoResult, null, 2)}</pre>
      `;
    }

    // ============ 错误处理 ============
    function showErrors(err) {
      const errorContent = document.getElementById('errorContent');
      errorContent.textContent = [
        '═══════════════════════════════════',
        '【处理失败】' + new Date().toLocaleString('zh-CN'),
        '═══════════════════════════════════',
        '',
        `错误类型: ${err.constructor.name}`,
        `错误消息: ${err.message || String(err)}`,
        '',
        `API 地址: ${API_BASE}`,
        `上传图片: ${uploadedImages.length} 张`,
        '',
        '完整堆栈:',
        err.stack || String(err),
        '═══════════════════════════════════',
      ].join('\n');

      // alert 确保手机端能看到
      alert('处理失败：' + err.message);

      errorPanel.classList.add('show');
    }

    document.getElementById('copyErrorBtn').addEventListener('click', () => {
      const content = document.getElementById('errorContent').textContent;
      navigator.clipboard.writeText(content).then(() => {
        alert('✅ 已复制到剪贴板');
      }).catch(() => {
        // 降级：手动选择
        const pre = document.getElementById('errorContent');
        const range = document.createRange();
        range.selectNode(pre);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
        document.execCommand('copy');
        alert('已手动选择，请 Ctrl+C 复制');
      });
    });

    document.getElementById('closeErrorBtn').addEventListener('click', () => {
      errorPanel.classList.remove('show');
    });

    // 点击背景关闭
    errorPanel.addEventListener('click', (e) => {
      if (e.target === errorPanel) {
        errorPanel.classList.remove('show');
      }
    });

    // ============ 工具 ============
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // ============ 初始化 ============
    // 显示当前访问地址（方便调试）
    console.log(`[init] 当前访问: ${window.location.href}`);
    console.log(`[init] API_BASE: ${API_BASE}`);
  </script>
</body>
</html>
